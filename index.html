<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY CARS Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-app">
        <h1>LUXURY CARS <span>— AUTOMOTIVE EXCELLENCE</span></h1>
        <p class="tagline">Experience the pinnacle of automotive engineering.</p>
        
        <div class="slider-container">
            <div class="slider">
                <div class="slides">
                    <!-- Slides will be added by JavaScript -->
                </div>
                <button class="nav-btn prev" aria-label="Previous image">&#10094;</button>
                <button class="nav-btn next" aria-label="Next image">&#10095;</button>
            </div>
            
            <div class="caption"></div>
            
            <div class="thumbnails"></div>
            
            <div class="controls">
                <button class="control-btn auto-slide">Start Auto Slide</button>
                <button class="control-btn pause-slide" style="display:none;">Pause</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
